- date: "2026.01"
  tag: "Media"
  text: "Our team **AllerVision**, which built an **AI agent-based pre-consultation system**, placed 2nd at the 1st SNU RISE Capstone Design Competition."
  outlet: "SNU College of Engineering"
  href: "https://eng.snu.ac.kr/communication/promotion/news?md=v&bbsidx=6320"

- date: "2026"
  tag: "Paper"
  text: "Our randomized controlled trial on **immersive VR training for novice physicians' emergency response skills** was published in **JMIR Medical Education (IF 13.9, ranked #1 of 89 in Education, Scientific Disciplines)**."
  href: "https://doi.org/10.2196/71455"

- date: "2026"
  tag: "Paper"
  text: "Our multi-institutional study on **deep learning-based breast implant classification in ultrasonography** was published in **Aesthetic Surgery Journal (ranked #1 in Plastic Surgery)**."
  href: "https://pubmed.ncbi.nlm.nih.gov/41168671/"

- date: "2025.09"
  tag: "Award"
  text: "Our team won **1st Prize** in the Emergency Procedure Hand Tracking task of the **MICCAI 2025 Trauma THOMPSON Challenge**, and **2nd place** in two Open Suturing Skills tasks of the **MICCAI 2025 Endoscopic Vision Challenge**."

- date: "2024.12"
  tag: "Media"
  text: "Seoul National University Hospital announced our **machine learning model for optimizing outpatient follow-up after cervical laminoplasty**, which identifies patients whose recovery makes yearly follow-up unnecessary."
  outlet: "Medifonews"
  href: "https://www.medifonews.com/news/article.html?no=198374"

- date: "2023.04"
