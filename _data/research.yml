# Edited by hand. Jekyll reads this as site.data.research
# See MAINTENANCE.md for the field reference.
- title: Medical Imaging AI
  summary: Deep learning models that read clinical images and radiographs, developed and externally validated
    on multi-institutional hospital data.
  topics:
    - Breast implant classification in ultrasonography (multi-institutional validation)
    - Identification of metabolic bone disease of prematurity from wrist radiographs
    - Differential diagnosis of ovarian neoplasms from pelvic ultrasonography
    - Multi-organ and pan-cancer segmentation from partially labeled abdominal CT
  keywords:
    - Deep Learning
    - Medical Image Processing
    - Segmentation
- title: "Surgical Video Understanding & Skill Assessment"
  summary: Models that recognize hands, instruments, and technical skill in surgical and emergency procedure
    video, benchmarked in international challenges.
  topics:
    - Emergency procedure hand tracking (MICCAI 2025 Trauma THOMPSON, 1st Prize)
    - OSATS score classification and hand/tool keypoint tracking (MICCAI 2025 EndoVis, 2nd place)
    - Synthetic data generation for surgical instrument segmentation
    - Ultra-lightweight prompt-based universal medical image segmentation (SwiftMedSAM)
  keywords:
    - Surgical Video Analysis
    - Keypoint Tracking
    - Skill Assessment
- title: "Extended Reality for Medical Education & Care"
  summary: VR, MR, and metaverse systems for clinical training, assessment, and patient-facing care, evaluated
    with randomized trials and user studies.
  topics:
    - Immersive VR training for emergency response skills (randomized controlled trial)
    - Metaverse-based objective structured clinical examination (OSCE)
    - VR-based art therapy for anxiety in hospitalized children
    - Mixed reality assessment of the K-MMSE three-stage command task from egocentric video
    - Contactless intraoperative remote surgical consent in immersive VR
  keywords:
    - Virtual Reality
    - Mixed Reality
    - Unity
    - Medical Education
- title: "Wearable Biosignals & Clinical Prediction"
  summary: Continuous, non-invasive monitoring from wearable and intraoperative signals, turned into early-warning
    and prognostic models.
  topics:
    - Early detection of post-thyroidectomy hypocalcemia from wearable single-lead ECG
    - Real-time prediction of pediatric hypokalemia from single-channel ECG
    - Prediction of problem behaviors in children with autism spectrum disorder from wearable sensors
    - EEG-based real-time attention state classification for VR medical education
    - fNIRS-based early dementia prediction and fNIRS + XR dizziness prediction
    - Intraoperative pain prediction from biosignals during anesthesia
  keywords:
    - Biosignal Processing
    - ECG
    - EEG
    - fNIRS
    - Time-series
  links:
    - label: Pain prediction talk
      href: "https://www.youtube.com/watch?v=14VZKOVxw2A"
- title: "Clinical LLM & Decision Support"
  summary: Language models applied to the administrative and pre-visit layer of care, where unstructured
    text slows clinicians down.
  topics:
    - LLM-based non-face-to-face pre-consultation system for allergy clinics
    - LLM-based standardization of medical insurance document names
    - Machine-learning models for post-cervical-laminoplasty outpatient follow-up scheduling
  keywords:
    - Large Language Models
    - Clinical NLP
    - Decision Support
