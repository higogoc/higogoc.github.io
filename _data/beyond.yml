# Edited by hand. Jekyll reads this as site.data.beyond
# A group with an empty `items` list is skipped entirely.
# `gallery` renders as a click-through photo strip under the stats; each
# image lives in images/ and carries a short caption.
# **double asterisks** render as bold.
intro: "Work that sits outside the publication record but shapes how I approach it."

stats:
  - { value: "500+", label: "Hours of volunteer service" }

gallery:
