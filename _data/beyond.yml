# Edited by hand. Jekyll reads this as site.data.beyond
# The page has two kinds of section:
#   volunteer  -> its own heading, with a stat row and a click-through photo
#                 strip. Each gallery `src` is a file in images/.
#   groups     -> dated entry lists. A group with an empty `items` is skipped.
# **double asterisks** render as bold.
intro: "Work that sits outside the publication record but shapes how I approach it."

volunteer:
  title: "Volunteer"
  stats:
    - { value: "500+", label: "Hours of volunteer service" }
  gallery:
    - src: "volunteer-1.jpg"
      caption: "PyeongChang 2018 Winter Olympics volunteer"
    - src: "volunteer-2.jpg"
      caption: "Coal briquette delivery volunteer"
    - src: "volunteer-3.jpg"
      caption: "Shelter dog care volunteer"

groups:
  - title: "Donation"
    items:
      - period: "2024"
        title: "Donation to the Department of Transdisciplinary Medicine Development Fund"
        org: "Seoul National University Hospital"
        detail: "**KRW 1,500,000**, funded by the prize from the **2024 Metaverse Developer Contest** (Ministry of Science and ICT) together with personal funds, directed to education and research within the department."
        links:
          - { label: "Development fund", href: "https://dtm.snuh.org/fund" }

  - title: "Athletics"
    items: []
