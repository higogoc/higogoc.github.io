bio:
  - "I am a **Ph.D. student at Seoul National University**, researching **extended reality for medical education** and **surgical digital twins**."
  - "My goal is not to stop at building the technology. It has to work in the clinic &mdash; **improving patient outcomes** and **the efficiency of clinical teams**. So I track where the technology is going, **respect the expertise of clinicians**, and learn from them to keep the research practical."
  - "As an engineer and a researcher, I try to carry a project across the whole path &mdash; from the model to a **system that fits an existing clinical workflow** &mdash; because that is usually where a promising result either reaches patients or stops. I am still learning how to do that well, and I hope to keep contributing to **unsolved medical problems through AI**."
