# Badge keys used in _data/publications.yml, awards.yml, talks.yml, education.yml.
# tier controls the styling: neutral (outline), accent (coloured), strong (filled).
# For a one-off label write "award:1st Prize" or "note:Best Paper" in the entry
# instead of adding a key here.
q1:            { label: "Q1",                     tier: "accent" }
q2:            { label: "Q2",                     tier: "neutral" }
top10:         { label: "Top 10%",                tier: "accent" }
first:         { label: "1st Author",             tier: "strong" }
cofirst:       { label: "Co-first Author",        tier: "strong" }
corresponding: { label: "Corresponding Author",   tier: "strong" }
presenter:     { label: "Presenter",              tier: "strong" }
oral:          { label: "Oral",                   tier: "neutral" }
poster:        { label: "Poster",                 tier: "neutral" }
challenge:     { label: "Challenge",              tier: "neutral" }
proceedings:   { label: "Proceedings",            tier: "neutral" }
intl:          { label: "International",          tier: "accent" }
international: { label: "International",          tier: "accent" }
domestic:      { label: "Domestic",               tier: "neutral" }
invited:       { label: "Invited",                tier: "accent" }
award:         { label: "Award",                  tier: "strong" }
note:          { label: "Note",                   tier: "neutral" }
